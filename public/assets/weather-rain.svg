<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rainDrop" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d8e3f4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a4b8db" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mistWash" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1f2638" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#323b52" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c1124" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Cool Mist Atmosphere -->
  <rect width="500" height="500" fill="url(#mistWash)"/>

  <!-- Slanted Rain Streaks (18° angle) -->
  <g stroke="url(#rainDrop)" stroke-width="1.2" stroke-linecap="round">
    <line x1="60" y1="20" x2="42" y2="75"/>
    <line x1="140" y1="10" x2="122" y2="68"/>
    <line x1="220" y1="35" x2="202" y2="92"/>
    <line x1="310" y1="15" x2="292" y2="70"/>
    <line x1="390" y1="40" x2="372" y2="95"/>
    <line x1="470" y1="25" x2="452" y2="82"/>

    <line x1="90" y1="130" x2="72" y2="188"/>
    <line x1="180" y1="110" x2="162" y2="170"/>
    <line x1="270" y1="145" x2="252" y2="202"/>
    <line x1="350" y1="125" x2="332" y2="182"/>
    <line x1="430" y1="150" x2="412" y2="208"/>

    <line x1="40" y1="240" x2="22" y2="298"/>
    <line x1="130" y1="220" x2="112" y2="280"/>
    <line x1="210" y1="255" x2="192" y2="312"/>
    <line x1="320" y1="235" x2="302" y2="292"/>
    <line x1="400" y1="260" x2="382" y2="318"/>
    <line x1="480" y1="245" x2="462" y2="302"/>

    <line x1="80" y1="350" x2="62" y2="408"/>
    <line x1="160" y1="330" x2="142" y2="390"/>
    <line x1="250" y1="365" x2="232" y2="422"/>
    <line x1="360" y1="345" x2="342" y2="402"/>
    <line x1="440" y1="370" x2="422" y2="428"/>

    <line x1="50" y1="440" x2="32" y2="498"/>
    <line x1="190" y1="430" x2="172" y2="488"/>
    <line x1="290" y1="455" x2="272" y2="505"/>
    <line x1="380" y1="435" x2="362" y2="492"/>
  </g>

  <!-- Finer Secondary Rain Veil -->
  <g stroke="#d8e3f4" stroke-width="0.6" stroke-linecap="round" opacity="0.35">
    <line x1="110" y1="50" x2="98" y2="88"/>
    <line x1="260" y1="70" x2="248" y2="108"/>
    <line x1="420" y1="60" x2="408" y2="98"/>
    <line x1="60" y1="180" x2="48" y2="218"/>
    <line x1="220" y1="190" x2="208" y2="228"/>
    <line x1="370" y1="170" x2="358" y2="208"/>
    <line x1="150" y1="300" x2="138" y2="338"/>
    <line x1="300" y1="310" x2="288" y2="348"/>
    <line x1="460" y1="290" x2="448" y2="328"/>
    <line x1="100" y1="410" x2="88" y2="448"/>
    <line x1="230" y1="420" x2="218" y2="458"/>
    <line x1="410" y1="400" x2="398" y2="438"/>
  </g>

  <!-- Droplet Glimmers -->
  <circle cx="162" cy="170" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="332" cy="182" r="1.2" fill="#ffffff" opacity="0.65"/>
  <circle cx="192" cy="312" r="1.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="422" cy="428" r="1.2" fill="#ffffff" opacity="0.7"/>
</svg>