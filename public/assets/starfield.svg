<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft cosmic nebula clouds -->
    <radialGradient id="nebula1" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3b2046" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#2a1633" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1c1124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#4a223e" stop-opacity="0.2"/>
      <stop offset="65%" stop-color="#22122b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1c1124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ef" stop-opacity="1"/>
      <stop offset="30%" stop-color="#e9c47a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e9c47a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Nebula Underlay -->
  <rect width="800" height="1200" fill="url(#nebula1)"/>
  <rect width="800" height="1200" fill="url(#nebula2)"/>

  <!-- Magnitude 1 Major Cross Stars -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="12" fill="url(#starGlow)"/>
    <path d="M0 -14 L0 14 M-14 0 L14 0" stroke="#fff8ef" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#e9c47a" stroke-width="0.8" opacity="0.6"/>
  </g>
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="10" fill="url(#starGlow)"/>
    <path d="M0 -12 L0 12 M-12 0 L12 0" stroke="#f7cad7" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(390, 480)">
    <circle cx="0" cy="0" r="14" fill="url(#starGlow)"/>
    <path d="M0 -16 L0 16 M-16 0 L16 0" stroke="#fff8ef" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#e9c47a" stroke-width="0.8" opacity="0.7"/>
  </g>
