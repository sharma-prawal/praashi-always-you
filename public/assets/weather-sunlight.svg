<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Sun Disc Bloom -->
    <radialGradient id="sunCore" cx="25%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#fff2db" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffd580" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#e9c47a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e9c47a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunWarmth" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#f7cad7" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#e9c47a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1c1124" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6dd" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ffd27a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Golden Hour Wash -->
  <rect width="500" height="500" fill="url(#sunWarmth)"/>

  <!-- Volumetric Sunlight Beams radiating from top-left -->
  <polygon points="120,120 0,380 70,500" fill="url(#rayBeam)" opacity="0.6"/>
  <polygon points="120,120 180,500 320,500" fill="url(#rayBeam)" opacity="0.7"/>
  <polygon points="120,120 420,500 500,460" fill="url(#rayBeam)" opacity="0.55"/>
  <polygon points="120,120 500,340 500,200" fill="url(#rayBeam)" opacity="0.45"/>

  <!-- Core Radiant Sun Orb & Outer Corona -->
  <circle cx="120" cy="120" r="140" fill="url(#sunCore)"/>
  <circle cx="120" cy="120" r="42" fill="#fff9eb" opacity="0.95"/>

  <!-- Cinematic Subtle Lens Rings & Orbs -->
  <ellipse cx="230" cy="230" rx="36" ry="36" fill="none" stroke="#ffe7ad" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="320" cy="320" rx="60" ry="60" fill="none" stroke="#f7cad7" stroke-width="0.7" opacity="0.25"/>
  <circle cx="280" cy="280" r="14" fill="#ffd98a" opacity="0.18"/>
  <circle cx="380" cy="380" r="28" fill="#f7cad7" opacity="0.12"/>
</svg>