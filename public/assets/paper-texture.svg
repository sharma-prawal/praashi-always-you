<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Ivory Parchment Base -->
    <linearGradient id="parchmentBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="45%" stop-color="#fdf6eb"/>
      <stop offset="85%" stop-color="#f7ebd7"/>
      <stop offset="100%" stop-color="#f0dfc5"/>
    </linearGradient>

    <!-- Edge Deckle Vignette -->
    <radialGradient id="edgeVignette" cx="50%" cy="50%" r="55%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="95%" stop-color="#8a6140" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6e4625" stop-opacity="0.14"/>
    </radialGradient>

    <!-- Subtle Paper Fiber Grain Filter -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.85
        0 0 0 0 0.78
        0 0 0 0 0.68
        0 0 0 0.05 0" in="noise" result="tintedNoise"/>
      <feComposite operator="in" in="tintedNoise" in2="SourceGraphic"/>
    </filter>

    <!-- Fine Gold Foil Gradient for Filigree -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3d79b"/>
      <stop offset="100%" stop-color="#aa8232"/>
    </linearGradient>
  </defs>

  <!-- Parchment Sheet Base -->
  <rect width="600" height="800" rx="4" fill="url(#parchmentBase)"/>
  <rect width="600" height="800" rx="4" fill="url(#edgeVignette)"/>

  <!-- Subtle Faint Paper Fiber Specks -->
  <g stroke="#9b7a58" stroke-width="0.5" opacity="0.12" stroke-linecap="round">
    <line x1="80" y1="90" x2="88" y2="92"/>
    <line x1="210" y1="140" x2="216" y2="143"/>
    <line x1="430" y1="110" x2="435" y2="114"/>
    <line x1="510" y1="230" x2="517" y2="231"/>
    <line x1="120" y1="310" x2="128" y2="312"/>
    <line x1="330" y1="280" x2="335" y2="284"/>
    <line x1="480" y1="410" x2="487" y2="412"/>
    <line x1="90" y1="520" x2="96" y2="523"/>
    <line x1="270" y1="490" x2="278" y2="492"/>
    <line x1="420" y1="580" x2="425" y2="584"/>
    <line x1="160" y1="670" x2="167" y2="672"/>
    <line x1="350" y1="640" x2="356" y2="643"/>
    <line x1="520" y1="710" x2="528" y2="712"/>
  </g>

  <!-- Delicate Border Inset Rules -->
  <rect x="22" y="22" width="556" height="756" rx="2" fill="none" stroke="url(#goldFoil)" stroke-width="0.6" opacity="0.3"/>
  <rect x="26" y="26" width="548" height="748" rx="2" fill="none" stroke="url(#goldFoil)" stroke-width="0.3" stroke-dasharray="3 4" opacity="0.2"/>

  <!-- Corner Filigree Ornaments -->
  <!-- Top Left Corner -->
  <g transform="translate(32, 32)" stroke="url(#goldFoil)" stroke-width="0.8" fill="none" opacity="0.45">
    <path d="M0 16 L0 0 L16 0"/>
    <circle cx="0" cy="0" r="1.5" fill="#f3d79b"/>
  </g>
  <!-- Top Right Corner -->
  <g transform="translate(568, 32)" stroke="url(#goldFoil)" stroke-width="0.8" fill="none" opacity="0.45">
    <path d="M0 16 L0 0 L-16 0"/>
    <circle cx="0" cy="0" r="1.5" fill="#f3d79b"/>
  </g>
  <!-- Bottom Left Corner -->
  <g transform="translate(32, 768)" stroke="url(#goldFoil)" stroke-width="0.8" fill="none" opacity="0.45">
    <path d="M0 -16 L0 0 L16 0"/>
    <circle cx="0" cy="0" r="1.5" fill="#f3d79b"/>
  </g>
  <!-- Bottom Right Corner -->
  <g transform="translate(568, 768)" stroke="url(#goldFoil)" stroke-width="0.8" fill="none" opacity="0.45">
    <path d="M0 -16 L0 0 L-16 0"/>
    <circle cx="0" cy="0" r="1.5" fill="#f3d79b"/>
  </g>
</svg>