    <script>
      // If the app can't arrive on a poor signal, say so kindly instead of showing an empty page.
      setTimeout(function () {
        if (document.getElementById('root').childElementCount) return;
        document.getElementById('root').innerHTML = '<p style="color:#fff8ef;font:20px/1.5 Georgia,serif;text-align:center;padding:38vh 28px 0">Still finding the way here…<br><a style="color:#e9c47a" href="">Tap to try again</a></p>';
      }, 12000);
    </script>
